name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: multi-repo-sync
            asset_name: multi-repo-sync-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: multi-repo-sync
            asset_name: multi-repo-sync-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: multi-repo-sync
            asset_name: multi-repo-sync-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: multi-repo-sync.exe
            asset_name: multi-repo-sync-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
